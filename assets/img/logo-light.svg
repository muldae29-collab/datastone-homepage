       원본: NAVER WORKS 드라이브 / 05.데이터스톤 / 00.회사문서 / 02.회사로고 등 / Datastone/Datastone.ai
       (Illustrator 파일이지만 내용은 PDF라 pdftocairo -svg 로 벡터 그대로 변환했다)

       원본에서 바꾼 것은 하나뿐이다 — 픽셀 하나하나에 걸려 있던 미세 그라디언트 41개를
       각각 중간색 하나로 평탄화했다. 2pt 사각형 안의 그라디언트는 웹 크기에서 보이지 않는데
       파일 크기의 90%(98KB→8KB)를 차지했다. 인쇄물에는 원본 .ai 를 쓸 것.

       글자는 윤곽선(path)이라 폰트가 없는 PC에서도 그대로 나온다.
       이 파일은 어두운 배경용 반전(전부 흰색) 버전이다. 도형은 logo.svg 와 동일하다. -->
